<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" width="1280" src="about:blank" style="border:0;overflow:hidden"></iframe>
<pre id="o"></pre>
<script type="module">
import { MARKUP, CODE } from './_probe-d.data.mjs';
const f = document.getElementById('f'), d = f.contentDocument;
d.open(); d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>'+MARKUP+'</body></html>'); d.close();
const s = d.createElement('script'); s.textContent = CODE; d.body.appendChild(s);
const L = [];
const tr = [...d.querySelectorAll('.dir-d-tile')];
L.push('count=' + tr.length);
tr.slice(0, 14).forEach((t, i) => {
  const r = t.getBoundingClientRect();
  const img = t.querySelector('img');
  const ir = img.getBoundingClientRect();
  L.push('#' + (i+1) + ' ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' ar=' + getComputedStyle(t).aspectRatio + ' imgN=' + img.naturalWidth + 'x' + img.naturalHeight + ' imgRect=' + Math.round(ir.width) + 'x' + Math.round(ir.height) + ' src=' + img.getAttribute('src'));
});
document.getElementById('o').textContent = L.join('\n');
document.title = 'DIAG4-DONE';
</script></body></html>
